# Documentation appendix. It is not consumed by the current environment run.sh.
schema_version: 2
planning_only: true
status: environment_ready_optimization_and_benchmark_pending
project:
  title: 面向完整查询完成时间的RAG重排推理跨层优化
  plan_version: '2.0'
  primary_objective: complete_query_goodput_under_fixed_slo
  optimization_count: 3
  optimizations:
    O1: query_completion_aware_batch_scheduling
    O2: shape_aware_cuda_graph_execution_with_eager_fallback
    O3: memory_budgeted_graph_selection_and_workspace_reuse
  shared_engineering:
    - cpu_tokenization_and_thread_configuration
    - host_device_transfer_configuration
    - model_precision_and_attention_backend
environment:
  python_major_minor: '3.12'
  project_venv: ../.venv
  reuse_existing_base: true
  requirements_lock: ../requirements.lock
  validation: ../env/smoke-latest.json
  all_environment_checks_passed: 9
  formal_performance_results_available: false
model:
  repository: BAAI/bge-reranker-base
  revision: 2cfc18c9415c912f9d8155881c133215df768a70
  dtype: float16
  attention_backend: sdpa
  eval_mode: true
  inference_mode: true
  output: raw_logits
  max_pair_tokens: 512
  truncation: longest_first
  padding_side: right
  result_tie_break: original_candidate_index
data:
  name: scifact
  corpus_documents_observed: 5183
  official_train_queries_observed: 809
  official_test_queries_observed: 300
  development_excluded_ids: ['1291', '871']
  exclusion_reason: normalized_query_text_occurs_in_official_test_set
  normalization: [NFKC, casefold, collapse_whitespace]
  split:
    seed_prefix: stage2-split-v2
    separator: U+0000
    ordering: SHA256_UTF8_prefix_separator_query_id
    calibration_count: 128
    validation_count: 64
    reserve_count: 615
    test: all_official_300_test_queries
  retrieval:
    implementation: rank-bm25
    package_version: 0.2.2
    algorithm: BM25Okapi
    k1: 1.5
    b: 0.75
    epsilon: 0.25
    document_text: title_space_text
    token_pattern: '\w+'
    normalization: [NFKC, casefold]
    tie_break: document_id_ascending_string
    stored_top_k: 100
    main_k: 50
    return_top_n: 10
  online_input: original_text
  use_precomputed_tokens_for_online_timing: false
  result_cache_enabled: false
shared_service:
  model_instances: 1
  gpu_workers: 1
  concurrent_graph_execution: false
  queue_limit_queries_initial: 32
  tokenizer_threads_initial: 2
  torch_cpu_threads_initial: 2
  inductor_compile_threads: 1
  overload: reject_before_admission_and_count_as_failure
  admitted_late_request: finish_and_record_lateness
  new_graph_capture_during_measured_window: false
  main_workspace_policy: reuse_for_all_main_variants
calibration:
  total_short_replay_trial_limit: 40
  batch_cap_candidates: [4, 8, 16, 32]
  token_budget_candidates: [2048, 4096, 8192]
  graph_batch_sizes: [1, 4, 8, 16, 32]
  graph_sequence_lengths: [64, 128, 256, 384, 512]
  shape_warmup_iterations_min: 10
  shape_timed_iterations_min: 50
  shape_memory_measurement: isolated_process_or_clean_graph_state
O1:
  scheduler_choices: [length_budget, completion_aware]
  active_window_candidates: [8, 16]
  completion_beta_candidates: [0.0, 0.5, 1.0, 2.0]
  batching_wait_ms_candidates: [0, 2]
  age_guard_slo_fraction_initial: 0.5
  max_candidate_actions: 64
  progress_weight: inverse_query_candidate_count
  use_future_arrivals: false
  cost_table: frozen_before_official_test
O2:
  backend_choices: [eager, graph_hybrid]
  eager_fallback: true
  routing: measured_cost_among_compatible_shapes_and_eager
  graph_input_output_addresses: persistent
  graph_baseline_buffers_counted_as_O3_contribution: false
  dummy_rows: valid_short_pair_excluded_from_real_results
  output_reuse: only_after_completion_and_result_copy
  attribution_control: identical_physical_shapes_eager_vs_graph
O3:
  graph_set_choices: [fixed, budgeted]
  fixed_graph_set: validation_tuned_and_feasible_under_the_same_budget
  selection: greedy_marginal_calibration_gain_per_incremental_memory
  max_graph_count: 8
  external_vram_margin_gib_initial: 1.0
  process_vram_cap_gib_initial: 6.0
  graph_increment_budget_mib_candidates: [256, 512, 1024]
  graph_pool_sharing_initial: false
  workspace_choices: [allocate, reuse]
  workspace_attribution_control: same_eager_executor_and_batch_trace
  workspace_experiment_scope: separate_diagnostic_not_a_confound_in_main_matrix
  final_graph_set: frozen_before_official_test
main_experiment:
  variants: [B1, S, G, SG, FULL, FULL-S]
  arrival_process: poisson
  query_order: seeded_permutation_per_cycle
  seeds: [1701, 1702, 1703]
  arrival_rate_reference: calibrated_B1_development_saturation_capacity_queries_per_second
  rate_multipliers: [0.5, 0.75, 0.9, 1.1]
  absolute_rates_shared_by_all_variants: true
  slo_definition: 2_times_development_baseline_isolated_query_p95_frozen_as_ms
  warmup_min_seconds: 20
  warmup_min_queries: 32
  measured_window_seconds: 120
  drain_limit: max_30_seconds_or_10_times_slo
  unit_count: 72
  independent_process_per_unit: true
  randomization_seed: 20261115
  matrix: 实验矩阵.csv
  profiler_in_measured_window: false
statistics:
  primary_unit: complete_query
  latency_origin: scheduled_arrival
  goodput_denominator: fixed_measured_window_seconds
  failure_denominator_includes_rejected_requests: true
  primary_tail_metric: p95
  p99_min_total_requests_per_configuration: 2000
  p99_min_independent_seeds: 3
  uncertainty: independent_runs_and_time_block_bootstrap
correctness:
  real_pair_exactly_once: true
  token_ids_and_truncation_equal: true
  logits_finite: true
  score_atol_initial: 0.01
  score_rtol_initial: 0.001
  ndcg10_max_absolute_drop_initial: 0.001
  report_mrr10_change: true
  ideal_dcg_source: full_query_qrels
  freeze_thresholds_before_test: true
formal_verification:
  priority: after_core_measurement_loop
  solver: z3
  bounded_queries: 4
  bounded_pairs_per_query: 4
  bounded_batch_size: 4
  bounded_transition_steps: 12
  buffer_slots: 2
  scope: lifecycle_index_mapping_and_buffer_safety
  claims_neural_floating_point_equivalence: false
engineering_targets_not_measured_results:
  full_goodput_improvement_over_B1: 0.15
  alternative_p95_reduction_at_matched_load_and_goodput: 0.15
  O1_cpu_scheduling_overhead_fraction_target: 0.05
external_comparators:
  sentence_transformers: required_standard_sdk_comparison
  torch_compile: required_standard_optimization_comparison
  tei: optional_after_container_validation
  external_dataset_or_model: one_preferred_after_main_results
